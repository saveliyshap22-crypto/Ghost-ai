[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-ide"
version = "0.1.0"
description = "Open-source console IDE/framework with local AI, search, scaffolding, and plugins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ghost IDE contributors" }]
dependencies = [
  "prompt-toolkit>=3.0.43",
  "Pygments>=2.17.2",
]

[project.optional-dependencies]
ai = ["llama-cpp-python>=0.2.90"]

[project.scripts]
ghostide = "ghostide.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

